name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 26

      - run: pnpm install --frozen-lockfile

      # `pnpm lint` is `biome check --write`: it repairs the drift and exits 0,
      # so running it here would pass on exactly the code CI exists to reject.
      - name: Lint
        run: pnpm lint:ci

      - name: Spell
        run: pnpm spell

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # One Worker serves the built game and the rooms. A room in progress
      # survives it: its Durable Object keeps its state and the sockets come
      # back. `pnpm secrets:sync` sets the secrets; a fork without them skips.
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm --filter @parallax/server exec wrangler deploy

      # `--with-deps` runs `apt-get update` over every source the runner image
      # carries, Google's Chrome repository among them; an index published
      # half-way fails the whole job on a hash mismatch. Playwright ships its
      # own Chromium, so the source goes.
      - name: Install Chromium
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google*
          pnpm --filter @parallax/game exec playwright install --with-deps chromium

      # Audits the Worker just deployed: `vite preview` serves no rooms. Without
      # the deploy it would judge an older build, so it skips along with it.
      - name: Lighthouse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm lighthouse

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: apps/game/lighthouse-reports
          if-no-files-found: ignore
          retention-days: 7

  # Workflows break at run time: a typo in an expression or a context passes
  # as plain YAML and only fails when the step is reached.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
